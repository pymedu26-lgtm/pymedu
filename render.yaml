# Blueprint para desplegar la API de PymEdu en Render (Vercel+Render).
# Uso: conectar el repo en Render -> New -> Blueprint, o crear un Web Service
# manual con rootDir = server.
services:
  - type: web
    name: pymedu-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    plan: free
    envVars:
      # Postgres en Railway. Copiar la URL publica de Railway y pegarla en el
      # dashboard de Render cuando lo pida.
      - key: DATABASE_URL
        sync: false
      # Firma los JWT de /login. Generar con: openssl rand -hex 32
      - key: JWT_SECRET
        sync: false
      - key: FRONT_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
